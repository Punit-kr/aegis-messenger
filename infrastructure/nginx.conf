# Aegis Production Reverse Proxy Configuration
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Upstream definitions
  upstream backend_relay {
    server backend:3001;
  }

  upstream web_client {
    server web:3000;
  }

  server {
    listen 80;
    server_name localhost;

    # Client application
    location / {
      proxy_pass http://web_client;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REST API routing
    location /api/ {
      proxy_pass http://backend_relay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 50M;
    }

    # Health Check
    location /health {
      proxy_pass http://backend_relay/health;
    }

    # Real-Time WebSocket Upstream
    location /ws {
      proxy_pass http://backend_relay/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }
  }
}
